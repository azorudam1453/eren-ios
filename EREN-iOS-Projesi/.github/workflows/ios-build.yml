name: EREN iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Kaynak kodunu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capacitor bağımlılıklarını kur
        run: npm install

      - name: iOS projesini oluştur
        run: npx cap add ios

      - name: Web dosyalarını iOS projesine aktar
        run: npx cap sync ios

      - name: iOS uygulamasını imzasız derle
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: İmzasız IPA paketini oluştur
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/EREN.app
          /usr/bin/zip -qry EREN-unsigned.ipa Payload

      - name: IPA dosyasını indirilebilir çıktı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: EREN-unsigned-IPA
          path: EREN-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
