name: EREN iOS IPA Oluştur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    defaults:
      run:
        working-directory: EREN-iOS-Projesi

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıkları yükle
        run: npm install

      - name: iOS projesini oluştur
        run: npx cap add ios

      - name: Capacitor eşitle
        run: npx cap sync ios

      - name: Uygulamayı derle
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: IPA dosyasını hazırla
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/EREN.app
          zip -r EREN-unsigned.ipa Payload

      - name: IPA dosyasını indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: EREN-unsigned-IPA
          path: EREN-iOS-Projesi/EREN-unsigned.ipa
          if-no-files-found: error
