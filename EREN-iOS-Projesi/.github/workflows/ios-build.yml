```yaml
name: EREN iOS IPA Oluştur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Proje klasörünü bul
        shell: bash
        run: |
          echo "Depodaki dosyalar:"
          ls -la
          echo "Proje klasörü:"
          find . -maxdepth 4 -name package.json -print

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Proje klasörünü belirle
        shell: bash
        run: |
          if [ -f "EREN-iOS-Projesi/package.json" ]; then
            echo "PROJECT_DIR=EREN-iOS-Projesi" >> "$GITHUB_ENV"
          elif [ -f "package.json" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "HATA: package.json bulunamadı."
            exit 1
          fi

      - name: Bağımlılıkları yükle
        run: npm install
        working-directory: ${{ env.PROJECT_DIR }}

      - name: iOS projesini kontrol et ve oluştur
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            npx cap add ios
          fi

      - name: Capacitor eşitle
        run: npx cap sync ios
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Uygulamayı derle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: IPA dosyasını hazırla
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/EREN.app
          zip -r EREN-unsigned.ipa Payload

      - name: IPA dosyasını indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: EREN-unsigned-IPA
          path: ${{ env.PROJECT_DIR }}/EREN-unsigned.ipa
          if-no-files-found: error
```
