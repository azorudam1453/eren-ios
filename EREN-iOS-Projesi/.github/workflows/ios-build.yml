```yaml
name: EREN iOS IPA Oluştur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    defaults:
      run:
        shell: bash

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Proje klasörünü belirle
        run: |
          if [ -f "EREN-iOS-Projesi/package.json" ]; then
            echo "PROJECT_DIR=EREN-iOS-Projesi" >> "$GITHUB_ENV"
          elif [ -f "package.json" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "HATA: package.json bulunamadı."
            exit 1
          fi

      - name: Bağımlılıkları yükle
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: npm install

      - name: Capacitor iOS eşitle
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}
        run: npx cap sync ios

      - name: CocoaPods bağımlılıklarını yükle
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}/ios/App
        run: |
          if [ ! -f "Podfile" ]; then
            echo "HATA: ios/App/Podfile bulunamadı."
            exit 1
          fi

          pod install

      - name: Workspace dosyasını kontrol et
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}/ios/App
        run: |
          if [ ! -d "App.xcworkspace" ]; then
            echo "HATA: App.xcworkspace oluşturulamadı."
            exit 1
          fi

      - name: iOS uygulamasını derle
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: IPA dosyasını oluştur
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}/ios/App
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "HATA: Derlenmiş App.app bulunamadı."
            exit 1
          fi

          rm -rf Payload EREN-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/EREN.app
          /usr/bin/zip -qr EREN-unsigned.ipa Payload

      - name: IPA dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: EREN-unsigned-IPA
          path: ${{ env.PROJECT_DIR }}/ios/App/EREN-unsigned.ipa
          if-no-files-found: error
```
