
name: EREN GitHub Pages Yayını

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: GitHub Pages ayarlarını yap
        uses: actions/configure-pages@v5

      - name: Web dosyalarını hazırla
        shell: bash
        run: |
          if [ -f "EREN-iOS-Projesi/www/index.html" ]; then
            SOURCE_DIR="EREN-iOS-Projesi/www"
          elif [ -f "www/index.html" ]; then
            SOURCE_DIR="www"
          else
            echo "HATA: index.html bulunamadı."
            find . -maxdepth 5 -name index.html
            exit 1
          fi

          mkdir -p _site
          cp -R "$SOURCE_DIR"/. _site/

          test -f _site/index.html
          echo "EREN web dosyaları hazır."

      - name: Yayın dosyalarını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4

