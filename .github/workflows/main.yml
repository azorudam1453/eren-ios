name: EREN GitHub Pages Yayını

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: GitHub Pages ayarlarını yap
        uses: actions/configure-pages@v5

      - name: www klasörünü yayın için hazırla
        run: |
          test -f www/index.html
          mkdir -p _site
          cp -R www/. _site/

      - name: Yayın dosyalarını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
