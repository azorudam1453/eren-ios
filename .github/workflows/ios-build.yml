
name: EREN iOS IPA Oluştur

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıkları yükle
        working-directory: EREN-iOS-Projesi
        run: npm install

      - name: iOS projesini hazırla
        working-directory: EREN-iOS-Projesi
        run: |
          npx cap add ios
          npx cap sync ios

      - name: iOS uygulamasını derle
        working-directory: EREN-iOS-Projesi
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          cp -R build/Build/Products/Release-iphoneos/App.app "$GITHUB_WORKSPACE/Payload/"
          cd "$GITHUB_WORKSPACE"
          zip -r EREN-unsigned.ipa Payload

      - name: IPA dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: EREN-unsigned-IPA
          path: EREN-unsigned.ipa
          retention-days: 7
